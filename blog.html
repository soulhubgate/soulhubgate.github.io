    <meta charset="UTF-8">

    <title>Liberary | Soul-Hub</title>

    <script src="https://cdn.tailwindcss.com"></script>

        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Cairo:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        html[lang="ar"] body {
            font-family: 'Cairo', sans-serif;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        @keyframes blob {
            0% {
                transform: translate(0px, 0px) scale(1);
            }

            33% {
                transform: translate(30px, -50px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }

            100% {
                transform: translate(0px, 0px) scale(1);
            }
        }

        .animate-blob {
            animation: blob 7s infinite;
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body
    class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-900">
    <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P7SC53BR"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

    <div id="app-container"
        class="w-full max-w-6xl glass-panel rounded-2xl flex flex-col relative overflow-hidden h-[90vh]">
        <div
            class="absolute top-0 left-0 w-32 h-32 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob pointer-events-none">
        </div>
        <div
            class="absolute top-0 right-0 w-32 h-32 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob animation-delay-2000 pointer-events-none">
        </div>

        <div id="nav-placeholder"></div>

        <div class="flex-1 overflow-y-auto custom-scrollbar p-6 md:p-10 relative">

            <div class="text-center mb-12 fade-in">
                <div class="inline-block p-3 rounded-2xl bg-indigo-500/10 text-indigo-300 mb-4">
                    <i class="fas fa-book-open text-3xl"></i>
                </div>
                <h1 class="text-4xl font-extrabold text-white mb-4" data-i18n="feat_lib_title">Liberary</h1>
                <p class="text-slate-400 max-w-2xl mx-auto" data-i18n="feat_lib_desc">Explore our deep-dive psychology encyclopedia with comprehensive 700-word articles. (Note: Sourced from Grokipedia).</p>
            </div>

            <!-- Enhanced Filters -->
            <div class="flex flex-wrap gap-2 justify-center mb-10 fade-in">
                <button onclick="filterAndRender('all')" id="btn-filter-all"
                    class="px-4 py-2 rounded-xl text-sm font-semibold transition-all shadow-md bg-indigo-600 text-white" data-i18n="filter_all">All</button>
                <button onclick="filterAndRender('mbti')" id="btn-filter-mbti"
                    class="px-4 py-2 rounded-xl text-sm font-semibold transition-all border border-emerald-500/30 text-emerald-300 bg-emerald-950/20 hover:bg-emerald-950/40" data-i18n="filter_mbti">16 Personalities</button>
                <button onclick="filterAndRender('love')" id="btn-filter-love"
                    class="px-4 py-2 rounded-xl text-sm font-semibold transition-all border border-pink-500/30 text-pink-300 bg-pink-950/20 hover:bg-pink-950/40" data-i18n="filter_love">Love & Relationships</button>
                <button onclick="filterAndRender('clinical')" id="btn-filter-clinical"
                    class="px-4 py-2 rounded-xl text-sm font-semibold transition-all border border-indigo-500/30 text-indigo-300 bg-indigo-950/20 hover:bg-indigo-950/40" data-i18n="filter_clinical">Clinical Psychology</button>
                <button onclick="filterAndRender('big5')" id="btn-filter-big5"
                    class="px-4 py-2 rounded-xl text-sm font-semibold transition-all border border-blue-500/30 text-blue-300 bg-blue-950/20 hover:bg-blue-950/40" data-i18n="filter_big5">Big Five Traits</button>
                <button onclick="filterAndRender('eq')" id="btn-filter-eq"
                    class="px-4 py-2 rounded-xl text-sm font-semibold transition-all border border-yellow-500/30 text-yellow-300 bg-yellow-950/20 hover:bg-yellow-950/40" data-i18n="filter_eq">Emotional Intelligence</button>
                <button onclick="filterAndRender('dark')" id="btn-filter-dark"
                    class="px-4 py-2 rounded-xl text-sm font-semibold transition-all border border-red-500/30 text-red-300 bg-red-950/20 hover:bg-red-950/40" data-i18n="filter_dark">Dark Triad</button>
            </div>

            <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Data from articles.js -->
            </div>

        </div>
    </div>

    <!-- Article Modal -->
    <div id="article-modal"
        class="fixed inset-0 z-50 hidden bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
        <div
            class="bg-slate-900 w-full max-w-4xl max-h-[85vh] rounded-2xl border border-slate-700/60 shadow-2xl flex flex-col relative overflow-hidden">
            <button onclick="closeModal()"
                class="absolute top-4 right-4 text-slate-400 hover:text-white text-2xl z-10 w-10 h-10 flex items-center justify-center bg-slate-800/75 hover:bg-slate-700/75 rounded-full transition-colors border border-slate-700/40">
                &times;
            </button>
            <div class="p-6 md:p-10 overflow-y-auto custom-scrollbar flex-1">
                <h2 id="modal-title" class="text-2xl md:text-3xl font-extrabold text-white mb-6 border-b border-slate-800 pb-4 leading-snug"></h2>
                <div id="modal-content" class="text-slate-300 leading-relaxed text-base md:text-lg"></div>
            </div>
            <div class="p-4 border-t border-slate-800 bg-slate-900 rounded-b-2xl">
                <button onclick="closeModal()" id="modal-back-btn"
                    class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-all shadow-lg hover:shadow-indigo-600/25">Close</button>
            </div>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/articles.js"></script>
    <script src="js/main.js"></script>
    <script>
        let currentFilter = 'all';

        function init() {
            window.handleLanguageChange = (lang) => {
                currentLang = lang;
                updateText();
                renderArticles(currentFilter);
            };
            updateText();
            renderArticles('all');
        }

        function updateText() {
            const t = translations[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) el.innerHTML = t[key];
            });
        }

        function filterAndRender(filter) {
            currentFilter = filter;
            
            // Manage Active Filter Button Styling
            const buttons = {
                all: document.getElementById('btn-filter-all'),
                mbti: document.getElementById('btn-filter-mbti'),
                love: document.getElementById('btn-filter-love'),
                clinical: document.getElementById('btn-filter-clinical'),
                big5: document.getElementById('btn-filter-big5'),
                eq: document.getElementById('btn-filter-eq'),
                dark: document.getElementById('btn-filter-dark')
            };

            const colors = {
                all: { active: 'bg-indigo-600 text-white', inactive: 'bg-transparent text-slate-300 border-slate-700/50 hover:bg-slate-800/30' },
                mbti: { active: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/50', inactive: 'border-emerald-500/30 text-emerald-300 bg-emerald-950/20 hover:bg-emerald-950/40' },
                love: { active: 'bg-pink-500/20 text-pink-300 border-pink-500/50', inactive: 'border-pink-500/30 text-pink-300 bg-pink-950/20 hover:bg-pink-950/40' },
                clinical: { active: 'bg-indigo-500/20 text-indigo-300 border-indigo-500/50', inactive: 'border-indigo-500/30 text-indigo-300 bg-indigo-950/20 hover:bg-indigo-950/40' },
                big5: { active: 'bg-blue-500/20 text-blue-300 border-blue-500/50', inactive: 'border-blue-500/30 text-blue-300 bg-blue-950/20 hover:bg-blue-950/40' },
                eq: { active: 'bg-yellow-500/20 text-yellow-300 border-yellow-500/50', inactive: 'border-yellow-500/30 text-yellow-300 bg-yellow-950/20 hover:bg-yellow-950/40' },
                dark: { active: 'bg-red-500/20 text-red-300 border-red-500/50', inactive: 'border-red-500/30 text-red-300 bg-red-950/20 hover:bg-red-950/40' }
            };

            Object.keys(buttons).forEach(key => {
                const btn = buttons[key];
                if (!btn) return;
                
                if (key === filter) {
                    btn.className = `px-4 py-2 rounded-xl text-sm font-semibold transition-all border shadow-md ${colors[key].active}`;
                } else {
                    btn.className = `px-4 py-2 rounded-xl text-sm font-semibold transition-all border ${colors[key].inactive}`;
                }
            });

            renderArticles(filter);
        }

        function renderArticles(filter) {
            const grid = document.getElementById('articles-grid');
            grid.innerHTML = '';

            articles.forEach(article => {
                if (filter !== 'all' && article.category !== filter) return;

                const card = document.createElement('div');
                card.className = 'glass-panel p-6 rounded-2xl flex flex-col hover:bg-slate-800/40 transition-all cursor-pointer group fade-in border border-slate-700/50 hover:border-indigo-500/50 hover:-translate-y-1 duration-300';
                card.onclick = () => openArticle(article);

                // Colors based on category
                let colorClass = 'text-indigo-400 border-indigo-500/20 bg-indigo-500/5';
                let categoryLabel = article.category.toUpperCase();
                
                if (article.category === 'mbti') {
                    colorClass = 'text-emerald-400 border-emerald-500/20 bg-emerald-500/5';
                    categoryLabel = currentLang === 'ar' ? 'الأنماط' : 'MBTI';
                } else if (article.category === 'love') {
                    colorClass = 'text-pink-400 border-pink-500/20 bg-pink-500/5';
                    categoryLabel = currentLang === 'ar' ? 'العلاقات' : 'Love';
                } else if (article.category === 'clinical') {
                    colorClass = 'text-indigo-400 border-indigo-500/20 bg-indigo-500/5';
                    categoryLabel = currentLang === 'ar' ? 'السريرية' : 'Clinical';
                } else if (article.category === 'eq') {
                    colorClass = 'text-yellow-400 border-yellow-500/20 bg-yellow-500/5';
                    categoryLabel = currentLang === 'ar' ? 'الذكاء العاطفي' : 'EQ';
                } else if (article.category === 'big5') {
                    colorClass = 'text-blue-400 border-blue-500/20 bg-blue-500/5';
                    categoryLabel = currentLang === 'ar' ? 'السمات الخمس الكبرى' : 'Big Five';
                } else if (article.category === 'dark') {
                    colorClass = 'text-red-400 border-red-500/20 bg-red-500/5';
                    categoryLabel = currentLang === 'ar' ? 'الثالوث المظلم' : 'Dark Triad';
                }

                const sum = article.summary ? article.summary[currentLang] : "Click to read more.";

                card.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <span class="px-2.5 py-1 text-xs font-bold uppercase tracking-wider rounded-md border ${colorClass}">${categoryLabel}</span>
                        <span class="text-xs text-slate-500 flex items-center gap-1"><i class="far fa-clock"></i> ~5 mins</span>
                    </div>
                    <h3 class="text-xl font-bold text-white mb-3 group-hover:text-indigo-300 transition-colors leading-snug">${article.title[currentLang]}</h3>
                    <p class="text-slate-400 text-sm flex-grow leading-relaxed mb-4">${sum}</p>
                    <div class="pt-4 border-t border-slate-700/50 flex justify-between items-center text-xs font-bold group-hover:text-white text-slate-400 transition-colors">
                        <span data-i18n="read_more_lib">${currentLang === 'ar' ? 'اقرأ المزيد' : 'Read Article'}</span>
                        <i class="fas fa-arrow-right rtl:rotate-180 group-hover:translate-x-1 duration-200"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openArticle(article) {
            document.getElementById('modal-title').innerText = article.title[currentLang];
            document.getElementById('modal-content').innerHTML = article.content[currentLang];

            const backText = currentLang === 'ar' ? 'العودة للموسوعة' : 'Back to Encyclopedia';
            document.getElementById('modal-back-btn').innerText = backText;

            document.getElementById('article-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('article-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        // Close on BG click
        document.getElementById('article-modal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        init();
    </script>
</body>

</html>
