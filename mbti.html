            { category: "TF", text: { en: "I take things personally. (Reverse)", ar: "آخذ الأمور بشكل شخصي. (عكسي)" }, reverse: true },
            { category: "TF", text: { en: "I make decisions based on values. (Reverse)", ar: "أتخذ القرارات بناءً على القيم. (عكسي)" }, reverse: true },

            // J vs P (High score = Judging)
            { category: "JP", text: { en: "I like to have a plan.", ar: "أحب أن يكون لدي خطة." } },
            { category: "JP", text: { en: "I finish work before playing.", ar: "أنهي العمل قبل اللعب." } },
            { category: "JP", text: { en: "I keep my space organized.", ar: "أحافظ على مساحتي منظمة." } },
            { category: "JP", text: { en: "I dislike last-minute changes.", ar: "أكره تغييرات اللحظة الأخيرة." } },
            { category: "JP", text: { en: "I make to-do lists.", ar: "أضع قوائم للمهام." } },
            { category: "JP", text: { en: "I prefer closure.", ar: "أفضل حسم الأمور." } },
            { category: "JP", text: { en: "I am punctual.", ar: "أنا دقيق في المواعيد." } },
            { category: "JP", text: { en: "I follow rules.", ar: "أتبع القواعد." } },
            { category: "JP", text: { en: "I like clear deadlines.", ar: "أحب المواعيد النهائية الواضحة." } },
            { category: "JP", text: { en: "I prepare in advance.", ar: "أستعد مسبقاً." } }, // 10
            { category: "JP", text: { en: "I leave things open-ended. (Reverse)", ar: "أترك الأمور مفتوحة. (عكسي)" }, reverse: true },
            { category: "JP", text: { en: "I am spontaneous. (Reverse)", ar: "أنا عفوي. (عكسي)" }, reverse: true },
            { category: "JP", text: { en: "I keep my options open. (Reverse)", ar: "أبقي خياراتي مفتوحة. (عكسي)" }, reverse: true },
            { category: "JP", text: { en: "I start projects at the last minute. (Reverse)", ar: "أبدأ المشاريع في اللحظة الأخيرة. (عكسي)" }, reverse: true },
            { category: "JP", text: { en: "I am messy/disorganized. (Reverse)", ar: "أنا فوضوي/غير منظم. (عكسي)" }, reverse: true }
        ];

        let scores = { "EI": 0, "SN": 0, "TF": 0, "JP": 0 };
        let currentQuestionIndex = 0;
        let shuffledQuestions = [];
        let answerHistory = [];

        function init() {
            window.handleLanguageChange = (lang) => {
                currentLang = lang;
                updateText();
                if (currentQuestionIndex < 60) renderQuestion();
                else showResult();
            };
            shuffleArray(questions);
            shuffledQuestions = questions;
        }

        function updateText() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) el.innerHTML = translations[currentLang][key];
            });
        }

        function startQuiz() {
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-quiz').classList.remove('hidden');
            scores = { "EI": 0, "SN": 0, "TF": 0, "JP": 0 };
            currentQuestionIndex = 0;
            renderOptions();
            renderQuestion();
        }

        function renderOptions() {
            const container = document.getElementById('options-container');
            const labels = [1, 2, 3, 4, 5];
            const t = translations[currentLang];
            const textLabels = [t.option_1, t.option_2, t.option_3, t.option_4, t.option_5];

            container.innerHTML = labels.map((val, idx) => `
                <button onclick="handleAnswer(${val})" class="btn-option w-full p-4 rounded-xl bg-slate-800/50 border border-slate-700 hover:border-emerald-500 text-start flex items-center group transition-all">
                    <span class="w-8 h-8 rounded-full border-2 border-slate-600 group-hover:border-emerald-500 me-4 flex items-center justify-center text-xs text-slate-500 group-hover:text-emerald-500 font-bold">${val}</span>
                    <span class="text-slate-300 group-hover:text-white font-medium">${textLabels[idx]}</span>
                </button>
            `).join('');
        }

        function renderQuestion() {
            const q = shuffledQuestions[currentQuestionIndex];
            const catName = categoriesTrans[q.category][currentLang];
            document.getElementById('question-category').innerText = catName;
            document.getElementById('question-text').innerText = q.text[currentLang];

            const progress = ((currentQuestionIndex) / 60) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('question-tracker').innerText = `${currentQuestionIndex + 1} / 60`;

            if (currentQuestionIndex > 0) document.getElementById('btn-back').classList.remove('hidden');
            else document.getElementById('btn-back').classList.add('hidden');
        }

        function handleAnswer(val) {
            const q = shuffledQuestions[currentQuestionIndex];
            let score = val;
            if (q.reverse) score = 6 - val;

            scores[q.category] += score;
            answerHistory.push(score);

            currentQuestionIndex++;
            if (currentQuestionIndex < 60) renderQuestion();
            else showResult();
        }

        function goBack() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                const lastScore = answerHistory.pop();
                const q = shuffledQuestions[currentQuestionIndex];
                scores[q.category] -= lastScore;
                renderQuestion();
            }
        }

        function calcPreference(score, rightChar, leftChar) {
            const isRight = score > 45;
            const pct = isRight 
                ? Math.round(((score - 45) / 30) * 50) + 50 
                : Math.round(((45 - score) / 30) * 50) + 50;
            return {
                char: isRight ? rightChar : leftChar,
                pct: pct
            };
        }

        function showResult() {
            document.getElementById('page-quiz').classList.add('hidden');
            document.getElementById('page-result').classList.remove('hidden');

            const prefEI = calcPreference(scores.EI, 'E', 'I');
            const prefSN = calcPreference(scores.SN, 'N', 'S');
            const prefTF = calcPreference(scores.TF, 'T', 'F');
            const prefJP = calcPreference(scores.JP, 'J', 'P');

            const type = [prefEI.char, prefSN.char, prefTF.char, prefJP.char].join('');

            document.getElementById('result-type').innerText = type;

            const lettersDiv = document.getElementById('result-letters');
            lettersDiv.innerHTML = type.split('').map(char => {
                const meaning = letterMeanings[char][currentLang];
                const desc = letterDescs[char][currentLang];
                return `
                    <div class="bg-emerald-950/20 border border-emerald-500/20 px-4 py-3 rounded-xl flex flex-col items-center min-w-[120px] fade-in">
                        <span class="text-2xl font-bold text-emerald-400 mb-1">${char}</span>
                        <span class="text-white font-bold text-sm mb-1">${meaning}</span>
                        <span class="text-[10px] text-slate-400 text-center max-w-[130px] leading-snug">${desc}</span>
                    </div>
                `;
            }).join('');

            const breakdown = document.getElementById('result-breakdown');
            breakdown.innerHTML = `
                ${makeVerticalBar(letterMeanings[prefEI.char][currentLang], prefEI.pct)}
                ${makeVerticalBar(letterMeanings[prefSN.char][currentLang], prefSN.pct)}
                ${makeVerticalBar(letterMeanings[prefTF.char][currentLang], prefTF.pct)}
                ${makeVerticalBar(letterMeanings[prefJP.char][currentLang], prefJP.pct)}
            `;

            // Upgraded Premium Dominant Profile Card
            const dominantCard = document.getElementById('dominant-profile-card');
            const archetype = mbtiArchetypes[type][currentLang];
            const groupKey = [prefSN.char, prefTF.char].join(''); // NT or NF
            const groupKeyAlt = [prefSN.char, prefJP.char].join(''); // SJ or SP
            const finalGroupKey = mbtiGroups[groupKey] ? groupKey : groupKeyAlt;
            const group = mbtiGroups[finalGroupKey];

            dominantCard.innerHTML = `
                <div class="glass-panel p-6 rounded-2xl border border-emerald-500/20 bg-slate-900/60 mt-4 fade-in text-start">
                    <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
                        <div>
                            <span class="text-xs uppercase tracking-widest text-emerald-400 font-bold block mb-1">${group.name[currentLang]}</span>
                            <h3 class="text-2xl font-bold text-white flex items-center gap-2">
                                ${archetype} <span class="text-emerald-300">(${type})</span>
                            </h3>
                        </div>
                        <span class="px-3 py-1.5 rounded-full text-xs font-bold border border-emerald-500/30 text-emerald-400 bg-emerald-500/10">
                            ${currentLang === 'en' ? "Optimal Preference" : "تفضيل متناسق"}
                        </span>
                    </div>

                    <p class="text-slate-300 text-sm leading-relaxed mb-6 border-l-2 border-emerald-500 pl-3 rtl:border-l-0 rtl:border-r-2 rtl:pl-0 rtl:pr-3">
                        <strong>${currentLang === 'en' ? "Jungian Personality Archetype" : "التوصيف اليونغي للنمط"}:</strong> 
                        ${currentLang === 'en' ? `As an ${type}, you belong to the ${group.name.en}. Your core superpower is ${group.superpower.en}.` : `بصفتك صاحب نمط ${type}، فأنت تنتمي إلى ${group.name.ar}. الميزة الأساسية لنمطك هي ${group.superpower.ar}.`}
                    </p>

                    <div class="space-y-4">
                        <div class="p-4 rounded-xl bg-emerald-950/10 border border-emerald-500/20">
                            <h4 class="text-sm font-bold text-emerald-400 flex items-center gap-2 mb-1.5">
                                <i class="fas fa-check-circle"></i>
                                ${currentLang === 'en' ? "Dominant Strengths & Superpowers" : "نقاط القوة والميزات الكبرى"}
                            </h4>
                            <p class="text-xs text-slate-300 leading-relaxed">${group.strengths[currentLang]}</p>
                        </div>

                        <div class="p-4 rounded-xl bg-red-950/10 border border-red-500/20">
                            <h4 class="text-sm font-bold text-red-400 flex items-center gap-2 mb-1.5">
                                <i class="fas fa-exclamation-triangle"></i>
                                ${currentLang === 'en' ? "Behavioral Blindspots & Growth Areas" : "المناطق العمياء وتحديات النمو"}
                            </h4>
                            <p class="text-xs text-slate-300 leading-relaxed">${group.weaknesses[currentLang]}</p>
                        </div>

                        <div class="p-4 rounded-xl bg-indigo-950/20 border border-indigo-500/20">
                            <h4 class="text-sm font-bold text-indigo-300 flex items-center gap-2 mb-1.5">
                                <i class="fas fa-route"></i>
                                ${currentLang === 'en' ? "Actionable Growth Path & Recommendations" : "خطوات التطوير والتمكين العملي"}
                            </h4>
                            <p class="text-xs text-slate-300 leading-relaxed">${group.advice[currentLang]}</p>
                        </div>
                    </div>
                </div>
            `;

            // Populate Stats Grid
            const statsGrid = document.getElementById('stats-grid');
            statsGrid.innerHTML = `
                ${makeStatRow(categoriesTrans.EI[currentLang], prefEI.pct, prefEI.char === 'E' ? (currentLang === 'en' ? 'Extravert (E)' : 'منبسط (E)') : (currentLang === 'en' ? 'Introvert (I)' : 'انطوائي (I)'), prefEI.pct > 75 ? 'High' : prefEI.pct >= 60 ? 'Moderate' : 'Balanced')}
                ${makeStatRow(categoriesTrans.SN[currentLang], prefSN.pct, prefSN.char === 'N' ? (currentLang === 'en' ? 'Intuitive (N)' : 'حدسي (N)') : (currentLang === 'en' ? 'Sensing (S)' : 'واقعي (S)'), prefSN.pct > 75 ? 'High' : prefSN.pct >= 60 ? 'Moderate' : 'Balanced')}
                ${makeStatRow(categoriesTrans.TF[currentLang], prefTF.pct, prefTF.char === 'T' ? (currentLang === 'en' ? 'Thinking (T)' : 'منطقي (T)') : (currentLang === 'en' ? 'Feeling (F)' : 'عاطفي (F)'), prefTF.pct > 75 ? 'High' : prefTF.pct >= 60 ? 'Moderate' : 'Balanced')}
                ${makeStatRow(categoriesTrans.JP[currentLang], prefJP.pct, prefJP.char === 'J' ? (currentLang === 'en' ? 'Judging (J)' : 'حازم (J)') : (currentLang === 'en' ? 'Perceiving (P)' : 'مرن (P)'), prefJP.pct > 75 ? 'High' : prefJP.pct >= 60 ? 'Moderate' : 'Balanced')}
            `;
        }

        function makeVerticalBar(label, pct) {
            return `
             <div class="bg-slate-700/30 p-4 rounded-xl flex flex-col items-center">
                <span class="text-xs text-slate-400 font-bold mb-2">${label}</span>
                <div class="w-full h-32 bg-slate-800 rounded-full relative overflow-hidden flex items-end justify-center">
                    <div class="w-full bg-gradient-to-t from-emerald-600 to-teal-400 transition-all duration-1000" style="height: ${pct}%"></div>
                </div>
                <span class="text-sm font-bold text-white mt-2">${pct}%</span>
            </div>
            `;
        }

        function makeStatRow(name, percent, preference, status) {
            let statusLabel = "";
            let badgeClass = "";
            if (status === 'High') {
                statusLabel = currentLang === 'en' ? "Strong" : "قوي";
                badgeClass = "border-emerald-500/30 text-emerald-400 bg-emerald-500/10";
            } else if (status === 'Moderate') {
                statusLabel = currentLang === 'en' ? "Moderate" : "معتدل";
                badgeClass = "border-teal-500/30 text-teal-400 bg-teal-500/10";
            } else {
                statusLabel = currentLang === 'en' ? "Balanced" : "متوازن";
                badgeClass = "border-slate-500/30 text-slate-400 bg-slate-500/10";
            }

            return `
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-2.5 rounded-lg border border-slate-700/30 hover:bg-slate-800/30 transition-all duration-300 group">
                <div class="flex items-center justify-between sm:justify-start gap-3 w-full sm:w-1/3">
                    <span class="text-sm font-semibold text-slate-300 group-hover:text-white truncate">${name}</span>
                    <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border ${badgeClass}">${statusLabel}</span>
                </div>
                <div class="flex-1 flex items-center gap-3 w-full">
                    <div class="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden">
                        <div class="h-full rounded-full bg-emerald-500 transition-all duration-1000" style="width: ${percent}%"></div>
                    </div>
                    <span class="text-xs font-semibold text-slate-400 group-hover:text-slate-200 w-24 text-end truncate">${preference}</span>
                    <span class="text-sm font-bold text-white w-10 text-end">${percent}%</span>
                </div>
            </div>`;
        }

        function shareResult(platform) {
            const type = document.getElementById('result-type').innerText;
            const url = encodeURIComponent(window.location.href);
            const text = currentLang === 'en' ? `I am an ${type}! Check your personality type on Soul-Hub:` : `أنا نمطي هو ${type}! اكتشف نمط شخصيتك على Soul-Hub:`;
            let shareUrl = '';
            if (platform === 'wa') shareUrl = `https://api.whatsapp.com/send?text=${text} ${url}`;
            if (platform === 'tw') shareUrl = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
            window.open(shareUrl, '_blank');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        init();
    </script>
