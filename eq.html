                },
                weaknesses: {

                weaknesses: {
                    en: "Prone to workaholism, setting impossibly high expectations for self/others, and potential executive burnout.",

            { category: "SR", text: { en: "I think before I act.", ar: "أفكر قبل أن أتصرف." } },
            { category: "SR", text: { en: "I handle pressure well.", ar: "أتعامل مع الضغط بشكل جيد." } },
            { category: "SR", text: { en: "I am adaptable to change.", ar: "أنا قابل للتكيف مع التغيير." } },
            { category: "SR", text: { en: "I stay focused under stress.", ar: "أحافظ على تركيزي تحت الضغط." } },
            { category: "SR", text: { en: "I impulsively interrupt others. (Reverse)", ar: "أقاطع الآخرين بشكل متهور. (عكسي)" }, reverse: true },

            { category: "MO", text: { en: "I give up easily when things get hard. (Reverse)", ar: "أستسلم بسهولة عندما تصبح الأمور صعبة. (عكسي)" }, reverse: true },

            { category: "EM", text: { en: "I am a good listener.", ar: "أنا مستمع جيد." } },
            { category: "EM", text: { en: "I understand non-verbal cues.", ar: "أفهم الإشارات غير اللفظية." } },
            { category: "EM", text: { en: "I see things from others' perspectives.", ar: "أرى الأمور من وجهة نظر الآخرين." } },
            { category: "EM", text: { en: "I am sensitive to cultural differences.", ar: "أنا حساس للاختلافات الثقافية." } },

        let currentQuestionIndex = 0;
        let shuffledQuestions = [];
        let answerHistory = [];

        function init() {
            window.handleLanguageChange = (lang) => {
                currentLang = lang;
                updateText();
                if (currentQuestionIndex < 50) renderQuestion();
                else renderChart();
            };
            shuffleArray(questions);
            shuffledQuestions = questions;
        }

        function updateText() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) el.innerHTML = translations[currentLang][key];
            });
        }

        function startQuiz() {
            document.getElementById('page-home').classList.add('hidden');
            document.getElementById('page-quiz').classList.remove('hidden');
            scores = { "SA": 0, "SR": 0, "MO": 0, "EM": 0, "SS": 0 };
            currentQuestionIndex = 0;
            renderOptions();
            renderQuestion();
        }

        function renderOptions() {
            const container = document.getElementById('options-container');
            const labels = [1, 2, 3, 4, 5];
            const t = translations[currentLang];
            const textLabels = [t.option_1, t.option_2, t.option_3, t.option_4, t.option_5];

            container.innerHTML = labels.map((val, idx) => `
                <button onclick="handleAnswer(${val})" class="btn-option w-full p-4 rounded-xl bg-slate-800/50 border border-slate-700 hover:border-yellow-500 text-start flex items-center group transition-all">
                    <span class="w-8 h-8 rounded-full border-2 border-slate-600 group-hover:border-yellow-500 me-4 flex items-center justify-center text-xs text-slate-500 group-hover:text-yellow-500 font-bold">${val}</span>
                    <span class="text-slate-300 group-hover:text-white font-medium">${textLabels[idx]}</span>
                </button>
            `).join('');
        }

        function renderQuestion() {
            const q = shuffledQuestions[currentQuestionIndex];
            const catName = categoriesTrans[q.category][currentLang];
            document.getElementById('question-category').innerText = catName;
            document.getElementById('question-text').innerText = q.text[currentLang];

            const progress = ((currentQuestionIndex) / 50) * 100;
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('question-tracker').innerText = `${currentQuestionIndex + 1} / 50`;

            if (currentQuestionIndex > 0) document.getElementById('btn-back').classList.remove('hidden');
            else document.getElementById('btn-back').classList.add('hidden');
        }

        function handleAnswer(val) {
            const q = shuffledQuestions[currentQuestionIndex];
            let score = val;
            if (q.reverse) score = 6 - val;

            scores[q.category] += score;
            answerHistory.push(score);

            currentQuestionIndex++;
            if (currentQuestionIndex < 50) renderQuestion();
            else showResult();
        }

        function goBack() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                const lastScore = answerHistory.pop();
                const q = shuffledQuestions[currentQuestionIndex];
                scores[q.category] -= lastScore;
                renderQuestion();
            }
        }

        function showResult() {
            document.getElementById('page-quiz').classList.add('hidden');
            document.getElementById('page-result').classList.remove('hidden');
            renderChart();
        }

        function renderChart() {
            const ctx = document.getElementById('radarChart').getContext('2d');
            const labels = Object.keys(scores).map(k => categoriesTrans[k][currentLang]);
            const data = Object.keys(scores).map(k => (scores[k] / 50) * 100);

            if (window.myRadarChart) window.myRadarChart.destroy();
            const fontFamily = currentLang === 'ar' ? "'Cairo', sans-serif" : "'Inter', sans-serif";

            window.myRadarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: currentLang === 'en' ? 'Percentile' : 'النسبة المئوية',
                        data: data,
                        backgroundColor: 'rgba(234, 179, 8, 0.4)',
                        borderColor: '#eab308',
                        pointBackgroundColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255,255,255,0.1)' },
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            pointLabels: { color: '#cbd5e1', font: { size: 12, family: fontFamily } },
                            ticks: { display: false, max: 100, min: 0 }
                        }
                    },
                    plugins: { legend: { labels: { font: { family: fontFamily } } } }
                }
            });

            // Find Dominant EQ Superpower
            const sortedKeys = Object.keys(scores).sort((a, b) => scores[b] - scores[a]);
            const dominantKey = sortedKeys[0];
            const dominantPercent = Math.round((scores[dominantKey] / 50) * 100);

            const profile = eqProfiles[dominantKey];
            const dominantCard = document.getElementById('dominant-profile-card');

            let severityLabel = "";
            let severityClass = "";
            if (dominantPercent > 75) {
                severityLabel = currentLang === 'en' ? "Exceptional Mastery" : "براعة عاطفية استثنائية";
                severityClass = "bg-emerald-500/20 text-emerald-400 border-emerald-500/30";
            } else if (dominantPercent >= 50) {
                severityLabel = currentLang === 'en' ? "Optimal Capability" : "قدرة عاطفية متوازنة";
                severityClass = "bg-yellow-500/20 text-yellow-400 border-yellow-500/30";
            } else {
                severityLabel = currentLang === 'en' ? "Developing Stage" : "مرحلة التطوير العاطفي";
                severityClass = "bg-red-500/20 text-red-400 border-red-500/30";
            }

            dominantCard.innerHTML = `
                <div class="glass-panel p-6 rounded-2xl border border-yellow-500/20 bg-slate-900/60 mt-4 fade-in text-start">
                    <div class="flex flex-wrap justify-between items-center gap-3 mb-4">
                        <div>
                            <span class="text-xs uppercase tracking-widest text-yellow-400 font-bold block mb-1">
                                ${currentLang === 'en' ? "Emotional Superpower Archetype" : "نمط القوة العاطفية السائدة"}
                            </span>
                            <h3 class="text-2xl font-bold text-white flex items-center gap-2">
                                ${profile.name[currentLang]} 
                                <span class="text-sm font-extrabold text-yellow-300">(${dominantPercent}%)</span>
                            </h3>
                        </div>
                        <span class="px-3 py-1.5 rounded-full text-xs font-bold border ${severityClass}">
                            ${severityLabel}
                        </span>
                    </div>

                    <div class="space-y-4">
                        <div class="p-4 rounded-xl bg-emerald-950/10 border border-emerald-500/20">
                            <h4 class="text-sm font-bold text-emerald-400 flex items-center gap-2 mb-1.5">
                                <i class="fas fa-check-circle"></i>
                                ${currentLang === 'en' ? "Adaptive Strengths & Capabilities" : "نقاط القوة التكيفية والمهارات الذاتية"}
                            </h4>
                            <p class="text-xs text-slate-300 leading-relaxed">${profile.strengths[currentLang]}</p>
                        </div>

                        <div class="p-4 rounded-xl bg-red-950/10 border border-red-500/20">
                            <h4 class="text-sm font-bold text-red-400 flex items-center gap-2 mb-1.5">
                                <i class="fas fa-exclamation-triangle"></i>
                                ${currentLang === 'en' ? "Dynamic Pitfalls & Potential Growth Risks" : "العقبات المحتملة ومخاطر السلوك"}
                            </h4>
                            <p class="text-xs text-slate-300 leading-relaxed">${profile.weaknesses[currentLang]}</p>
                        </div>

                        <div class="p-4 rounded-xl bg-yellow-950/20 border border-yellow-500/20">
                            <h4 class="text-sm font-bold text-yellow-300 flex items-center gap-2 mb-1.5">
                                <i class="fas fa-magic"></i>
                                ${currentLang === 'en' ? "Actionable EQ Exercises & Coaching Path" : "تمارين عملية لرفع الذكاء العاطفي"}
                            </h4>
                            <p class="text-xs text-slate-300 leading-relaxed">${profile.advice[currentLang]}</p>
                        </div>
                    </div>
                </div>
            `;

            const statsGrid = document.getElementById('stats-grid');
            statsGrid.innerHTML = Object.keys(scores).map(k => {
                const pct = Math.round((scores[k] / 50) * 100);
                const name = categoriesTrans[k][currentLang];
                
                let badgeClass = "";
                let statusText = "";
                
                if (pct > 75) {
                    badgeClass = "border-emerald-500/30 text-emerald-400 bg-emerald-500/10";
                    statusText = currentLang === 'en' ? "Exceptional" : "استثنائي";
                } else if (pct >= 50) {
                    badgeClass = "border-yellow-500/30 text-yellow-400 bg-yellow-500/10";
                    statusText = currentLang === 'en' ? "Optimal" : "مثالي";
                } else {
                    badgeClass = "border-red-500/30 text-red-400 bg-red-500/10";
                    statusText = currentLang === 'en' ? "Developing" : "نامي";
                }

                return `
                 <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 p-2.5 rounded-lg border border-slate-700/30 hover:bg-slate-800/30 transition-all duration-300 group text-start">
                    <div class="flex items-center justify-between sm:justify-start gap-3 w-full sm:w-1/3">
                        <span class="text-sm font-semibold text-slate-300 group-hover:text-white truncate">${name}</span>
                        <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border ${badgeClass}">${statusText}</span>
                    </div>
                    <div class="flex-1 flex items-center gap-3 w-full">
                        <div class="flex-1 h-2 bg-slate-700 rounded-full overflow-hidden">
                            <div class="h-full rounded-full bg-yellow-500 transition-all duration-1000" style="width: ${pct}%"></div>
                        </div>
                        <span class="text-sm font-bold text-white w-10 text-end">${pct}%</span>
                    </div>
                </div>
                `;
            }).join('');
        }

        function shareResult(platform) {
            const url = encodeURIComponent(window.location.href);
            const text = currentLang === 'en' ? "My Emotional Intelligence Result:" : "نتيجتي في اختبار الذكاء العاطفي:";
            let shareUrl = '';
            if (platform === 'wa') shareUrl = `https://api.whatsapp.com/send?text=${text} ${url}`;
            if (platform === 'tw') shareUrl = `https://twitter.com/intent/tweet?text=${text}&url=${url}`;
            window.open(shareUrl, '_blank');
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        init();
    </script>
<script src="js/ai-assistant.js"></script></body>
</html>
